name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Running the golden tests on two Node.js (V8) versions proves that simulation results do
        # not depend on the JavaScript engine version.
        node: ['22', '24']
    services:
      # The API's tests run on a real PostgreSQL (S12): each test file creates its own database.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, boundaries, typecheck, lint, tests
        run: pnpm check
      - run: pnpm build
      - name: The API runs from its bundle on PostgreSQL (migrate, demo data, a command, the audit)
        run: |
          node apps/api/dist/gateflow-api.mjs migrate
          node apps/api/dist/gateflow-api.mjs seed --scenario scenarios/vce-like-peak-day.yaml | tee seed.txt
          CP=$(sed -n 's/.*checkpoint \([0-9a-f-]*\),.*/\1/p' seed.txt)
          # Staff sign in (S15): a supervisor added by the command line, a session in a cookie jar.
          node apps/api/dist/gateflow-api.mjs user add --airport vce-like --login ci.supervisor --role supervisor | tee user.txt
          PASSWORD=$(sed -n 's/^password //p' user.txt)
          node apps/api/dist/gateflow-api.mjs serve --port 18080 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/v1/health && break; sleep 1; done
          curl -sf -c jar.txt -X POST http://127.0.0.1:18080/v1/auth/sign-in -H 'Content-Type: application/json' \
            -d "{\"login\":\"ci.supervisor\",\"password\":\"$PASSWORD\"}"
          curl -sf -b jar.txt -X POST "http://127.0.0.1:18080/v1/checkpoints/$CP/calls" -H 'Idempotency-Key: ci-1'
          curl -sf -b jar.txt "http://127.0.0.1:18080/v1/checkpoints/$CP/audit/verify" | tee verify.json
          grep -q '"intact":true' verify.json
          # The same bundle serves the web application (S14), under its security policy.
          curl -sfD headers.txt "http://127.0.0.1:18080/kiosk/$CP" | grep -q '<div id="root">'
          grep -qi '^content-security-policy:' headers.txt
      - name: End-to-end determinism of the CLI, whatever the number of worker threads
        run: |
          node apps/sim-cli/dist/gateflow-sim.mjs run --scenario scenarios/single-checkpoint-demo.yaml --seeds 1-20 --out out/a --quiet --workers 1
          node apps/sim-cli/dist/gateflow-sim.mjs run --scenario scenarios/single-checkpoint-demo.yaml --seeds 1-20 --out out/b --quiet --workers 4
          cmp out/a/results.json out/b/results.json
          cmp out/a/report.md out/b/report.md
          cmp out/a/report.html out/b/report.html
          node apps/sim-cli/dist/gateflow-sim.mjs sweep --spec sweeps/data-quality-disrupted.yaml --seeds 1-3 --out out/sa --quiet --workers 1
          node apps/sim-cli/dist/gateflow-sim.mjs sweep --spec sweeps/data-quality-disrupted.yaml --seeds 1-3 --out out/sb --quiet --workers 4
          cmp out/sa/sweep.json out/sb/sweep.json
          cmp out/sa/sweep.html out/sb/sweep.html
          # A scenario whose flights come from a CSV file (S7).
          node apps/sim-cli/dist/gateflow-sim.mjs run --scenario scenarios/vce-like-peak-day.yaml --seeds 1-10 --out out/fa --quiet --workers 1
          node apps/sim-cli/dist/gateflow-sim.mjs run --scenario scenarios/vce-like-peak-day.yaml --seeds 1-10 --out out/fb --quiet --workers 4
          cmp out/fa/results.json out/fb/results.json
          cmp out/fa/report.html out/fb/report.html
          # Extra lanes (S8): the staff on call and the forecast are the same in every worker.
          node apps/sim-cli/dist/gateflow-sim.mjs run --scenario scenarios/tsf-like-peak-day.yaml --seeds 1-10 --out out/la --quiet --workers 1 \
            --policies fifo-manual,fifo-manual@reactive,fifo-manual@predict,priority-v3@predict
          node apps/sim-cli/dist/gateflow-sim.mjs run --scenario scenarios/tsf-like-peak-day.yaml --seeds 1-10 --out out/lb --quiet --workers 4 \
            --policies fifo-manual,fifo-manual@reactive,fifo-manual@predict,priority-v3@predict
          cmp out/la/results.json out/lb/results.json
          cmp out/la/report.html out/lb/report.html
      - name: The library flight lists are up to date
        run: node scenarios/flights/make-library-flights.mjs --check

  studio:
    name: Simulator Studio in Chromium
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @gateflow/studio exec playwright install --with-deps chromium
      - name: The page gives the CLI's results, with and without workers, and never uses the network
        run: pnpm --filter @gateflow/studio run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: gateflow-studio
          path: apps/studio/dist/gateflow-studio.html

  web:
    name: Kiosk and ticket page in Chromium
    needs: check
    runs-on: ubuntu-latest
    services:
      # The product itself runs in these tests: the API's bundle on PostgreSQL.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @gateflow/web exec playwright install --with-deps chromium
      - name: A passenger takes a number at the kiosk and follows it on a phone, in three languages
        env:
          GATEFLOW_SHOTS: out/screens
        run: pnpm --filter @gateflow/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateflow-web-screens
          path: apps/web/out/screens
          if-no-files-found: ignore

  demo-reports:
    name: Scenario reports (200 simulated days)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Simulate the demo scenarios and the scenario library
        run: |
          # Priority v2 is included so that every report also shows the effect of the S5 rules.
          for scenario in single-checkpoint-demo single-checkpoint-moderate single-checkpoint-staffed single-checkpoint-strategic single-checkpoint-disrupted single-checkpoint-feed-stress \
            vce-like-normal-day vce-like-peak-day vce-like-disrupted-day tsf-like-peak-day mx-like-transfer-hub; do
            node apps/sim-cli/dist/gateflow-sim.mjs run --scenario "scenarios/$scenario.yaml" --seeds 1-200 \
              --policies fifo,fifo-manual,virtual-fifo,priority-v2,priority-v3 --out "out/$scenario"
          done
      - name: Extra lanes on the scenario library (S8)
        run: |
          for scenario in vce-like-normal-day vce-like-peak-day vce-like-disrupted-day tsf-like-peak-day mx-like-transfer-hub; do
            node apps/sim-cli/dist/gateflow-sim.mjs run --scenario "scenarios/$scenario.yaml" --seeds 1-200 \
              --policies fifo,fifo-manual,fifo-manual@reactive,fifo-manual@predict,priority-v3,priority-v3@predict \
              --out "out/lanes/$scenario"
          done
      - name: Sensitivity sweeps (20 days per point; the published sweeps use 200)
        run: |
          for spec in sweeps/*.yaml; do
            node apps/sim-cli/dist/gateflow-sim.mjs sweep --spec "$spec" --seeds 1-20 --out "out/sweeps/$(basename "$spec" .yaml)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-reports
          path: out/
