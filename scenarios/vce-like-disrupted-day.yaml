# GateFlow simulation scenario (schema version 5).
#
# SYNTHETIC LIBRARY SCENARIO. "VCE-like" means sized like Venice Marco Polo from its public annual
# traffic. It is not a model of the real airport, of its checkpoint or of its schedule. The
# parameters of the airport and of its checkpoint are in airports/vce-like.yaml; this file gives
# only the day. Results obtained with it are simulated and must never be presented as operational
# evidence.

schemaVersion: 5
extends:
  airport: ../airports/vce-like.yaml
  checkpoint: departures
id: vce-like-disrupted-day
title: VCE-like departures checkpoint, disrupted summer peak day (synthetic)
description: >-
  The summer peak day of vce-like-peak-day (same flights, passengers and lane plan) with
  disruptions: a quarter of the flights are delayed (announced 10 to 120 minutes before departure),
  a tenth change gate, about two lanes per day fail for a while and the flight feed goes down
  about once a day, as in single-checkpoint-disrupted. The system decides on what the feed has told
  it; outcomes are judged on the ground truth.
dataSources:
  - id: library-flights
    title: Synthetic flight list of the scenario library
    kind: SYNTHETIC
    provider: GateFlow (scenarios/flights/make-library-flights.mjs)
    licence: Created for GateFlow; contains no third-party schedule data.

checkpoint:
  laneSchedule:
    value:
      - { from: '00:00', lanes: 2 }
      - { from: '03:00', lanes: 4 }
      - { from: '04:00', lanes: 10 }
      - { from: '05:00', lanes: 12 }
      - { from: '07:00', lanes: 10 }
      - { from: '08:00', lanes: 11 }
      - { from: '11:00', lanes: 10 }
      - { from: '12:00', lanes: 9 }
      - { from: '13:00', lanes: 10 }
      - { from: '14:00', lanes: 12 }
      - { from: '15:00', lanes: 10 }
      - { from: '16:00', lanes: 9 }
      - { from: '17:00', lanes: 8 }
      - { from: '18:00', lanes: 7 }
      - { from: '19:00', lanes: 6 }
      - { from: '20:00', lanes: 3 }
      - { from: '21:00', lanes: 2 }
    source: SYNTHETIC
    note: >-
      Planned for this day with the lane plan rule of the checkpoint (airports/vce-like.yaml):
      177.0 lane-hours. gateflow-sim lanes --scenario <this file> prints the plan again.

schedule:
  kind: flight-list
  generatorSeed: 20261121
  flights:
    source: library-flights
    file: flights/vce-like-peak-day.csv

passengers:
  loadFactor:
    value: { min: 0.72, mode: 0.9, max: 1 }
    source: SYNTHETIC
    ref: save-traffic-2025
    note: >-
      Summer load factors, drawn per flight and day. With the flight list the day has about 22,000
      departing passengers, about 1.35 times the average day of 2025 (11.85 million passengers,
      half of them departing, over 365 days): assumed peak-day factor.
  groups:
    value:
      partySizes:
        - { size: 1, share: 0.7 }
        - { size: 2, share: 0.2 }
        - { size: 3, share: 0.05 }
        - { size: 4, share: 0.04 }
        - { size: 5, share: 0.01 }
    source: SYNTHETIC
    note: More couples and families than on a normal day (leisure season).

disruptions:
  flightDelays:
    value:
      share: 0.25
      medianMinutes: 20
      sigma: 0.8
      maxMinutes: 180
      noticeMinMinutesBeforeStd: 10
      noticeMaxMinutesBeforeStd: 120
    source: SYNTHETIC
    note: >-
      A quarter of the flights are delayed (log-normal, median 20 minutes). The delay is announced
      uniformly between 120 and 10 minutes before the scheduled departure; passengers still arrive
      for the scheduled departure.
  gateChanges:
    value:
      { share: 0.1, minMinutesBeforeStd: 30, maxMinutesBeforeStd: 70, noticeDelayMaxMinutes: 5 }
    source: SYNTHETIC
    note: >-
      A tenth of the flights change gate 70 to 30 minutes before departure; the feed reports it up to
      5 minutes later. Passengers screened after the change walk to the new gate.
  laneOutages:
    value: { perDay: 2, medianMinutes: 20, sigma: 0.5, maxMinutes: 60 }
    source: SYNTHETIC
    note: About two unplanned outages of one lane per day (median 20 minutes); at least one lane stays open.
  feedOutages:
    value: { perDay: 1, medianMinutes: 30, sigma: 0.6, maxMinutes: 120 }
    source: SYNTHETIC
    note: >-
      The flight feed goes down about once a day (median 30 minutes). Messages sent meanwhile arrive
      when it recovers.
